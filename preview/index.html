<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#140e0f">
  <title>HP Server Monitor · UI Preview</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-blue"></span>
    <span class="blob blob-teal"></span>
    <span class="blob blob-pink"></span>
  </div>

  <div id="app" class="app">
    <aside id="sidebar" class="sidebar" aria-label="主导航">
      <div id="liquid" class="liquid" aria-hidden="true"></div>

      <button class="nav-bubble active" data-view="overview" aria-label="总览" aria-current="page" title="总览">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        <span class="nav-tip">总览</span>
      </button>

      <button class="nav-bubble" data-view="cpu" aria-label="CPU" title="CPU">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/><rect x="10.5" y="10.5" width="3" height="3" rx="1"/></svg>
        <span class="nav-tip">CPU</span>
      </button>

      <button class="nav-bubble" data-view="gpu" aria-label="GPU" title="GPU">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="8.5" cy="12" r="2.4"/><path d="M13.5 10h4.5M13.5 14h4.5"/></svg>
        <span class="nav-tip">GPU</span>
      </button>

      <button class="nav-bubble" data-view="memory" aria-label="内存" title="内存">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 7v4M12 7v4M17 7v4M6 17v3M12 17v3M18 17v3"/></svg>
        <span class="nav-tip">内存</span>
      </button>

      <button class="nav-bubble" data-view="storage" aria-label="存储" title="存储">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
        <span class="nav-tip">存储</span>
      </button>

      <button class="nav-bubble" data-view="network" aria-label="网络" title="网络">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9a13 13 0 0 1 16 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5.5 5.5 0 0 1 7 0"/><path d="M12 19.5h.01"/></svg>
        <span class="nav-tip">网络</span>
      </button>

      <button class="nav-bubble" data-view="fans" aria-label="风扇" title="风扇">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M12 10c0-3 1-5 4-5s4 3 3 5-4 2-7 2"/><path d="M14 12c3 0 5 1 5 4s-3 4-5 3-2-4-2-7"/><path d="M12 14c0 3-1 5-4 5s-4-3-3-5 4-2 7-2"/><path d="M10 12c-3 0-5-1-5-4s3-4 5-3 2 4 2 7"/></svg>
        <span class="nav-tip">风扇</span>
      </button>

      <button class="nav-bubble" data-view="settings" aria-label="设置" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h4M12 17h8"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        <span class="nav-tip">设置</span>
      </button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-heading">
          <p class="eyebrow" id="page-eyebrow">SYSTEM OVERVIEW</p>
          <h1 id="page-title">总览</h1>
          <p id="page-subtitle" class="page-subtitle">静态预览 · Mock 数据</p>
        </div>
        <div class="host-badge">
          <span class="host-dot"></span>
          <span id="host-name">OLD-LAPTOP</span>
          <span id="host-uptime" class="host-uptime"></span>
          <span class="badge info" title="当前为静态 mock 数据">MOCK</span>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>

    <div id="live-pill" class="live-pill ok" role="status">
      <span class="pill-dot"></span>
      <span id="live-text">预览模式 · 更新于 0 秒前</span>
    </div>
  </div>

  <div id="preview-login" class="login-overlay" hidden>
    <form id="preview-login-form" class="login-card" autocomplete="off">
      <div class="login-brand">
        <div class="brand-orb"></div>
        <div>
          <h1>HP Server Monitor</h1>
          <p>家庭服务器实时状态 · 登录页样式预览</p>
        </div>
      </div>
      <label class="field">
        <span>用户名</span>
        <input type="text" value="admin" readonly>
      </label>
      <label class="field">
        <span>密码</span>
        <input type="password" value="preview-password" readonly>
      </label>
      <p class="form-error">这是登录页的静态样式预览，不会发起任何请求。</p>
      <button class="btn-primary" type="button" id="preview-login-close">返回监控预览</button>
      <p class="login-hint">直接双击 preview/index.html 即可查看此预览</p>
    </form>
  </div>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <script src="./app.js" defer></script>
</body>
</html>
